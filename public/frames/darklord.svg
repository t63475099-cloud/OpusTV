<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" fill="none">
  <defs>
    <linearGradient id="a-darklord" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F87171">
        <animate attributeName="stop-color" values="#F87171;#991B1B;#F87171" dur="3s" repeatCount="indefinite"/>
      </stop>
      <stop offset="50%" stop-color="#991B1B"/>
      <stop offset="100%" stop-color="#450A0A">
        <animate attributeName="stop-color" values="#450A0A;#F87171;#450A0A" dur="3s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>
    <linearGradient id="b-darklord" x1="1" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#991B1B"/><stop offset="100%" stop-color="#F87171"/>
    </linearGradient>
    <radialGradient id="r-darklord" cx="50%" cy="50%" r="50%">
      <stop offset="65%" stop-color="transparent"/>
      <stop offset="100%" stop-color="#991B1B" stop-opacity="0.4">
        <animate attributeName="stop-opacity" values="0.25;0.55;0.25" dur="2.2s" repeatCount="indefinite"/>
      </stop>
    </radialGradient>
    <filter id="gl-darklord" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="2.4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <circle cx="100" cy="100" r="98" fill="url(#r-darklord)"/>
  <!-- rotating dashed ring -->
  <g>
    <animateTransform attributeName="transform" type="rotate" from="0 100 100" to="360 100 100" dur="12s" repeatCount="indefinite"/>
    <circle cx="100" cy="100" r="94" stroke="url(#a-darklord)" stroke-width="4.5" stroke-dasharray="18 10" fill="none" filter="url(#gl-darklord)" opacity="0.95"/>
  </g>
  <circle cx="100" cy="100" r="88" stroke="#FCA5A5" stroke-width="1.5" opacity="0.7"/>
  <circle cx="100" cy="100" r="82" stroke="url(#b-darklord)" stroke-width="3.2" fill="none"/>
  <circle cx="100" cy="100" r="76" stroke="#F87171" stroke-width="1" opacity="0.4"/>
  <!-- counter-rotate inner ornaments -->
  <g filter="url(#gl-darklord)">
    <animateTransform attributeName="transform" type="rotate" from="360 100 100" to="0 100 100" dur="18s" repeatCount="indefinite"/>
    <g fill="#F87171" stroke="#450A0A" stroke-width="0.6">
      <path d="M100 4 L112 26 L100 20 L88 26 Z"/>
      <path d="M100 196 L112 174 L100 180 L88 174 Z"/>
      <path d="M4 100 L26 112 L20 100 L26 88 Z"/>
      <path d="M196 100 L174 112 L180 100 L174 88 Z"/>
    </g>
  </g>
  <!-- corner flourishes -->
  <g stroke="#991B1B" stroke-width="2.2" fill="none" opacity="0.95">
    <path d="M28 38 C40 18 62 22 72 38"/>
    <path d="M172 38 C160 18 138 22 128 38"/>
    <path d="M28 162 C40 182 62 178 72 162"/>
    <path d="M172 162 C160 182 138 178 128 162"/>
  </g>
  <!-- pulsing gems -->
  <g fill="#F87171">
    <circle cx="38" cy="48" r="3.5"><animate attributeName="r" values="3;4.2;3" dur="1.8s" repeatCount="indefinite"/></circle>
    <circle cx="162" cy="48" r="3.5"><animate attributeName="r" values="3;4.2;3" dur="1.8s" begin="0.4s" repeatCount="indefinite"/></circle>
    <circle cx="38" cy="152" r="3.5"><animate attributeName="r" values="3;4.2;3" dur="1.8s" begin="0.8s" repeatCount="indefinite"/></circle>
    <circle cx="162" cy="152" r="3.5"><animate attributeName="r" values="3;4.2;3" dur="1.8s" begin="1.2s" repeatCount="indefinite"/></circle>
  </g>
  <g fill="#991B1B" opacity="0.9" filter="url(#gl-darklord)">
    <path d="M12 78 L28 100 L12 122 L18 100 Z"/>
    <path d="M188 78 L172 100 L188 122 L182 100 Z"/>
  </g>
  <path d="M70 18 L100 10 L130 18 L100 28 Z" fill="#F87171" stroke="#450A0A" stroke-width="0.5" opacity="0.95">
    <animate attributeName="opacity" values="0.7;1;0.7" dur="2s" repeatCount="indefinite"/>
  </path>
</svg>