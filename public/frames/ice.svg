<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" fill="none">
  <defs>
    <linearGradient id="a-ice" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#A5F3FC"/><stop offset="50%" stop-color="#22D3EE"/><stop offset="100%" stop-color="#0E7490"/>
    </linearGradient>
    <linearGradient id="b-ice" x1="1" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#22D3EE"/><stop offset="100%" stop-color="#A5F3FC"/>
    </linearGradient>
    <radialGradient id="r-ice" cx="50%" cy="50%" r="50%">
      <stop offset="70%" stop-color="transparent"/><stop offset="100%" stop-color="#22D3EE" stop-opacity="0.35"/>
    </radialGradient>
    <filter id="gl-ice" x="-25%" y="-25%" width="150%" height="150%">
      <feGaussianBlur stdDeviation="2.2" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <circle cx="100" cy="100" r="98" fill="url(#r-ice)"/>
  <!-- multi rings -->
  <circle cx="100" cy="100" r="94" stroke="url(#a-ice)" stroke-width="5" filter="url(#gl-ice)"/>
  <circle cx="100" cy="100" r="88" stroke="#ECFEFF" stroke-width="1.5" opacity="0.7"/>
  <circle cx="100" cy="100" r="82" stroke="url(#b-ice)" stroke-width="3.5"/>
  <circle cx="100" cy="100" r="76" stroke="#A5F3FC" stroke-width="1" opacity="0.45"/>
  <!-- diamond ornaments N E S W -->
  <g filter="url(#gl-ice)" fill="#A5F3FC" stroke="#0E7490" stroke-width="0.6">
    <path d="M100 4 L112 26 L100 20 L88 26 Z"/>
    <path d="M100 196 L112 174 L100 180 L88 174 Z"/>
    <path d="M4 100 L26 112 L20 100 L26 88 Z"/>
    <path d="M196 100 L174 112 L180 100 L174 88 Z"/>
  </g>
  <!-- corner flourishes -->
  <g stroke="#22D3EE" stroke-width="2.2" fill="none" opacity="0.95">
    <path d="M28 38 C40 18 62 22 72 38"/>
    <path d="M172 38 C160 18 138 22 128 38"/>
    <path d="M28 162 C40 182 62 178 72 162"/>
    <path d="M172 162 C160 182 138 178 128 162"/>
  </g>
  <g fill="#A5F3FC">
    <circle cx="38" cy="48" r="3.5"/><circle cx="162" cy="48" r="3.5"/>
    <circle cx="38" cy="152" r="3.5"/><circle cx="162" cy="152" r="3.5"/>
  </g>
  <!-- side wings -->
  <g fill="#22D3EE" opacity="0.85" filter="url(#gl-ice)">
    <path d="M12 78 L28 100 L12 122 L18 100 Z"/>
    <path d="M188 78 L172 100 L188 122 L182 100 Z"/>
  </g>
  <!-- top crown bar -->
  <path d="M70 18 L100 10 L130 18 L100 28 Z" fill="#A5F3FC" stroke="#0E7490" stroke-width="0.5" opacity="0.9"/>
</svg>