<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" fill="none">
  <defs>
    <linearGradient id="g-lq10" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#E879F9">
        <animate attributeName="stop-color" values="#E879F9;#A21CAF;#E879F9" dur="3s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" stop-color="#4A044E"/>
    </linearGradient>
    <filter id="f-lq10" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.8" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <!-- outer rotating dashes -->
  <g>
    <animateTransform attributeName="transform" type="rotate" from="0 100 100" to="360 100 100" dur="16s" repeatCount="indefinite"/>
    <rect x="12" y="12" width="176" height="176" rx="36" stroke="url(#g-lq10)" stroke-width="5" stroke-dasharray="14 8" fill="none" filter="url(#f-lq10)" opacity="0.95"/>
  </g>
