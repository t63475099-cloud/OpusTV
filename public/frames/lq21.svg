<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" fill="none">
  <defs>
    <linearGradient id="g-lq21" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFE08A">
        <animate attributeName="stop-color" values="#FFE08A;#F5A623;#FFE08A" dur="3s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" stop-color="#B8860B"/>
    </linearGradient>
    <filter id="f-lq21" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.8" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <!-- outer rotating dashes -->
  <g>
    <animateTransform attributeName="transform" type="rotate" from="0 100 100" to="360 100 100" dur="16s" repeatCount="indefinite"/>
    <rect x="12" y="12" width="176" height="176" rx="36" stroke="url(#g-lq21)" stroke-width="5" stroke-dasharray="14 8" fill="none" filter="url(#f-lq21)" opacity="0.95"/>
  </g>
  <rect x="22" y="22" width="156" height="156" rx="30" stroke="#F5A623" stroke-width="2.5" fill="none" opacity="0.85"/>
  <rect x="30" y="30" width="140" height="140" rx="26" stroke="#FFE08A" stroke-width="1.2" fill="none" opacity="0.5"/>
  <!-- music / notes -->
  <g fill="#FFE08A" opacity="0.9">
    <circle cx="30" cy="40" r="4"/><rect x="33" y="20" width="2.5" height="20" rx="1"/>
    <circle cx="170" cy="160" r="4"/><rect x="164.5" y="140" width="2.5" height="20" rx="1"/>
  </g>
  <path d="M40 30 Q100 10 160 30" stroke="#F5A623" stroke-width="2" fill="none"/>
  <path d="M40 170 Q100 190 160 170" stroke="#F5A623" stroke-width="2" fill="none"/>
</svg>