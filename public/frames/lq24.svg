<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" fill="none">
  <defs>
    <linearGradient id="g-lq24" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#C4B5FD">
        <animate attributeName="stop-color" values="#C4B5FD;#8B5CF6;#C4B5FD" dur="3s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" stop-color="#5B21B6"/>
    </linearGradient>
    <filter id="f-lq24" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.8" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <!-- outer rotating dashes -->
  <g>
    <animateTransform attributeName="transform" type="rotate" from="0 100 100" to="360 100 100" dur="16s" repeatCount="indefinite"/>
    <rect x="12" y="12" width="176" height="176" rx="36" stroke="url(#g-lq24)" stroke-width="5" stroke-dasharray="14 8" fill="none" filter="url(#f-lq24)" opacity="0.95"/>
  </g>
  <rect x="22" y="22" width="156" height="156" rx="30" stroke="#8B5CF6" stroke-width="2.5" fill="none" opacity="0.85"/>
  <rect x="30" y="30" width="140" height="140" rx="26" stroke="#C4B5FD" stroke-width="1.2" fill="none" opacity="0.5"/>
  <!-- banner top -->
  <path d="M60 14 L100 6 L140 14 L130 28 L100 20 L70 28 Z" fill="#8B5CF6" stroke="#C4B5FD" stroke-width="1"/>
  <circle cx="100" cy="16" r="5" fill="#C4B5FD"/>
  <path d="M24 50 Q40 30 60 42" stroke="#C4B5FD" stroke-width="2.5" fill="none"/>
  <path d="M176 50 Q160 30 140 42" stroke="#C4B5FD" stroke-width="2.5" fill="none"/>
</svg>