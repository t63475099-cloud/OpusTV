<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" fill="none">
  <defs>
    <linearGradient id="g-lq49" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#E7E5E4">
        <animate attributeName="stop-color" values="#E7E5E4;#A8A29E;#E7E5E4" dur="3s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" stop-color="#57534E"/>
    </linearGradient>
    <filter id="f-lq49" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.8" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <!-- outer rotating dashes -->
  <g>
    <animateTransform attributeName="transform" type="rotate" from="0 100 100" to="360 100 100" dur="16s" repeatCount="indefinite"/>
    <rect x="12" y="12" width="176" height="176" rx="36" stroke="url(#g-lq49)" stroke-width="5" stroke-dasharray="14 8" fill="none" filter="url(#f-lq49)" opacity="0.95"/>
  </g>
  <rect x="22" y="22" width="156" height="156" rx="30" stroke="#A8A29E" stroke-width="2.5" fill="none" opacity="0.85"/>
  <rect x="30" y="30" width="140" height="140" rx="26" stroke="#E7E5E4" stroke-width="1.2" fill="none" opacity="0.5"/>
  <!-- corner gems -->
  <g fill="#E7E5E4">
    <circle cx="28" cy="28" r="5"><animate attributeName="opacity" values="0.6;1;0.6" dur="1.8s" repeatCount="indefinite"/></circle>
    <circle cx="172" cy="28" r="5"><animate attributeName="opacity" values="0.6;1;0.6" dur="1.8s" begin="0.4s" repeatCount="indefinite"/></circle>
    <circle cx="28" cy="172" r="5"/><circle cx="172" cy="172" r="5"/>
  </g>
  <path d="M100 8 L110 22 L100 18 L90 22 Z" fill="#E7E5E4"/>
  <path d="M100 192 L110 178 L100 182 L90 178 Z" fill="#E7E5E4"/>
</svg>